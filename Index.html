<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Price Comparator</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Inter font and custom colors -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb; /* Light background */
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">
    <div class="max-w-6xl mx-auto">

        <!-- Header -->
        <header class="text-center py-6 sm:py-10 bg-white rounded-xl shadow-lg mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-indigo-700">🛒 Ultimate Price Finder</h1>
            <p class="mt-2 text-gray-500">Compare prices across stores and find the best deals.</p>
        </header>

        <!-- Search and Filter Controls -->
        <div class="bg-white p-6 rounded-xl shadow-lg mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Search Input -->
            <div>
                <label for="search-input" class="block text-sm font-medium text-gray-700 mb-1">Search Product</label>
                <input type="text" id="search-input" placeholder="e.g., Laptop, Coffee Maker, Book"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                       oninput="filterProducts()">
            </div>

            <!-- Category Filter -->
            <div>
                <label for="category-filter" class="block text-sm font-medium text-gray-700 mb-1">Filter by Category</label>
                <select id="category-filter" onchange="filterProducts()"
                        class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                    <option value="All">All Categories</option>
                    <!-- Options populated by JS -->
                </select>
            </div>
            
            <!-- Sort by Price -->
            <div>
                <label for="sort-select" class="block text-sm font-medium text-gray-700 mb-1">Sort Results</label>
                <select id="sort-select" onchange="filterProducts()"
                        class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                    <option value="none">Default (A-Z)</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                </select>
            </div>

        </div>

        <!-- Results Area -->
        <div id="results-container" class="space-y-6">
            <!-- Product Cards will be injected here -->
        </div>

        <!-- No Results Message -->
        <div id="no-results" class="hidden text-center p-10 bg-white rounded-xl shadow-lg">
            <p class="text-xl text-gray-500">No products match your current search criteria.</p>
        </div>

    </div>

    <script>
        // --- MOCK DATA ---
        // In a real application, this data would come from a server API call.
        const mockProducts = [
            {
                id: 1,
                name: "AcoustiCo ProSound X9 Headphones",
                category: "Electronics",
                description: "Premium over-ear noise-cancelling headphones with 40-hour battery life.",
                prices: [
                    { store: "TechMart", price: 299.99, url: "#" },
                    { store: "SoundZone", price: 310.50, url: "#" },
                    { store: "GlobalE", price: 289.00, url: "#" },
                    { store: "LocalDeals", price: 305.00, url: "#" }
                ]
            },
            {
                id: 2,
                name: "The Future of AI: A Beginner's Guide",
                category: "Books",
                description: "A comprehensive introduction to Artificial Intelligence and Machine Learning.",
                prices: [
                    { store: "Bookworm Central", price: 19.50, url: "#" },
                    { store: "Kindle Store", price: 12.99, url: "#" },
                    { store: "Library Direct", price: 22.00, url: "#" }
                ]
            },
            {
                id: 3,
                name: "Espresso Maestro Home Brewer",
                category: "Home Goods",
                description: "High-pressure, semi-automatic espresso maker with built-in grinder.",
                prices: [
                    { store: "Kitchen King", price: 450.00, url: "#" },
                    { store: "Appliance Hub", price: 445.99, url: "#" },
                    { store: "GlobalE", price: 475.00, url: "#" }
                ]
            },
            {
                id: 4,
                name: "ErgoComfort Office Chair (Grey)",
                category: "Furniture",
                description: "Ergonomic mesh office chair with adjustable lumbar support.",
                prices: [
                    { store: "Office Outlet", price: 189.99, url: "#" },
                    { store: "Furniture Fast", price: 195.00, url: "#" },
                    { store: "Design Pro", price: 179.50, url: "#" }
                ]
            },
            {
                id: 5,
                name: "4K Ultra-Thin Monitor 32-inch",
                category: "Electronics",
                description: "Vibrant display with 1ms response time, perfect for gaming and design.",
                prices: [
                    { store: "TechMart", price: 620.00, url: "#" },
                    { store: "Gamer's Paradise", price: 605.99, url: "#" }
                ]
            }
        ];

        // --- UTILITY FUNCTIONS ---

        // Function to find the lowest price for a product
        function getLowestPrice(prices) {
            if (!prices || prices.length === 0) return { store: "N/A", price: Infinity };
            
            return prices.reduce((lowest, current) => {
                return current.price < lowest.price ? current : lowest;
            }, { store: "N/A", price: Infinity });
        }

        // Function to format the price
        function formatPrice(price) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2,
            }).format(price);
        }

        // --- RENDERING LOGIC ---

        // Function to create the HTML for a single store's price
        function createStorePriceHTML(priceItem) {
            return `
                <div class="flex justify-between items-center text-sm py-1 border-b border-gray-100 last:border-b-0">
                    <span class="font-semibold text-gray-600">${priceItem.store}</span>
                    <a href="${priceItem.url}" target="_blank" class="flex items-center text-indigo-600 hover:text-indigo-800 transition duration-150">
                        ${formatPrice(priceItem.price)}
                        <!-- External Link Icon (inline SVG for style) -->
                        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4m-4-4l-6-6m0 0l6-6m-6 6h6"></path></svg>
                    </a>
                </div>
            `;
        }

        // Function to render the product cards
        function renderProducts(products) {
            const container = document.getElementById('results-container');
            const noResults = document.getElementById('no-results');
            container.innerHTML = '';

            if (products.length === 0) {
                container.classList.add('hidden');
                noResults.classList.remove('hidden');
                return;
            }

            container.classList.remove('hidden');
            noResults.classList.add('hidden');

            products.forEach(product => {
                const lowestPriceObj = getLowestPrice(product.prices);
                const allPricesHTML = product.prices.map(createStorePriceHTML).join('');
                
                // Card HTML structure
                const productCardHTML = `
                    <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-indigo-500 flex flex-col md:flex-row gap-6">
                        
                        <!-- Product Info (Left/Top) -->
                        <div class="md:w-3/5">
                            <h2 class="text-2xl font-bold text-gray-800 mb-1">${product.name}</h2>
                            <span class="inline-block text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-600 mb-3">${product.category}</span>
                            <p class="text-gray-600 mb-4">${product.description}</p>
                            
                            <div class="p-4 bg-green-50 rounded-lg border border-green-200">
                                <p class="text-lg font-bold text-green-700">🏆 Lowest Price Found:</p>
                                <p class="text-3xl font-extrabold text-green-600 mt-1">
                                    ${formatPrice(lowestPriceObj.price)}
                                    <span class="text-base font-medium text-gray-500">at ${lowestPriceObj.store}</span>
                                </p>
                            </div>
                        </div>

                        <!-- Price Comparison List (Right/Bottom) -->
                        <div class="md:w-2/5 md:border-l md:pl-6">
                            <h3 class="text-lg font-semibold text-gray-700 mb-3 border-b pb-1">All Available Prices (${product.prices.length})</h3>
                            <div class="space-y-1 max-h-40 overflow-y-auto pr-2">
                                ${allPricesHTML}
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', productCardHTML);
            });
        }

        // --- FILTERING AND SORTING LOGIC ---

        function filterProducts() {
            const searchInput = document.getElementById('search-input').value.toLowerCase();
            const categoryFilter = document.getElementById('category-filter').value;
            const sortSelect = document.getElementById('sort-select').value;

            // 1. Filtering
            let filtered = mockProducts.filter(product => {
                // Category check
                const categoryMatch = categoryFilter === 'All' || product.category === categoryFilter;

                // Search term check (name or description)
                const searchMatch = product.name.toLowerCase().includes(searchInput) ||
                                    product.description.toLowerCase().includes(searchInput);

                return categoryMatch && searchMatch;
            });

            // 2. Sorting
            if (sortSelect !== 'none') {
                filtered.sort((a, b) => {
                    const priceA = getLowestPrice(a.prices).price;
                    const priceB = getLowestPrice(b.prices).price;

                    if (sortSelect === 'price-asc') {
                        return priceA - priceB;
                    } else if (sortSelect === 'price-desc') {
                        return priceB - priceA;
                    }
                    // Default sort (by name A-Z if 'none' is selected, though 'none' shouldn't hit this logic)
                    return a.name.localeCompare(b.name); 
                });
            } else {
                 // Default to sorting by name if 'none' is selected
                 filtered.sort((a, b) => a.name.localeCompare(b.name));
            }
            

            // 3. Render
            renderProducts(filtered);
        }

        // --- INITIAL SETUP ---

        function initializeApp() {
            // Populate category filter dropdown
            const categories = [...new Set(mockProducts.map(p => p.category))].sort();
            const filterElement = document.getElementById('category-filter');

            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                filterElement.appendChild(option);
            });

            // Initial render
            filterProducts();
        }

        // Run the initialization when the window loads
        window.onload = initializeApp;

    </script>
</body>
</html>
